# Security findings
security_findings:
  F-SEC-01:
    description: "Repository is PUBLIC — should be PRIVATE per Addendum A14."
    status: RESOLVED
    resolution: "Owner-decided to keep PUBLIC. Preserved, not changed."
  F-SEC-02:
    description: "XOR encryption in credential vault — inadequate for production."
    status: RESOLVED
    resolution: "AES-256-GCM envelope encryption with AAD, key versioning, fail-closed production, legacy XOR migration. Branch fix/f-sec-02-03-encryption-identity merged to main (PR #12)."
    evidence: "test-house/security/f-sec-02-03-evidence.md, tests/test_f_sec_02_encryption.py"
  F-SEC-03:
    description: "In-memory identity store — no durable persistence."
    status: RESOLVED
    resolution: "SQLAlchemy-backed PersistentIdentityStore with SQLite (dev) / PostgreSQL (prod), versioned migrations, fail-closed production. Branch fix/f-sec-02-03-encryption-identity merged to main (PR #12)."
    evidence: "test-house/security/f-sec-02-03-evidence.md, tests/test_f_sec_03_persistence.py"

