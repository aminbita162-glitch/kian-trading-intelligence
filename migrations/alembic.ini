# Alembic configuration for Kian Trading Intelligence.
# NOTE: Alembic is NOT installed as a dependency. This config is provided
# for future use when Alembic is added. The lightweight migration framework
# in services/identity/migrations.py is used instead.

[alembic]
script_location = %(here)s/migrations
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
