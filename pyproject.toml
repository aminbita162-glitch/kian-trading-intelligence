[project]
name = "kian-trading-intelligence"
version = "0.1.0"
description = "Secure, auditable, cost-aware cryptocurrency trading and mining intelligence platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
    { name = "Amin Azimi", email = "noreply@azimi-innovation-lab.example" },
]

dependencies = [
    "fastapi>=0.115.0",
    "pydantic>=2.10.0",
    "uvicorn[standard]>=0.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8.0",
    "mypy>=1.13",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["contracts", "services", "services.core", "services.identity", "services.market_data", "services.risk_kernel", "services.execution", "services.ledger", "services.agents", "services.mining", "services.client", "services.security"]

[tool.setuptools.package-dir]
contracts = "packages/contracts"
services = "services"
"services.core" = "services/core"
"services.identity" = "services/identity"
"services.market_data" = "services/market_data"
"services.risk_kernel" = "services/risk_kernel"
"services.execution" = "services/execution"
"services.ledger" = "services/ledger"
"services.agents" = "services/agents"
"services.mining" = "services/mining"
"services.client" = "services/client"
"services.security" = "services/security"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["services", "packages", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PL"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["PLR2004"]

[tool.ruff.lint.isort]
known-first-party = ["contracts", "services"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
