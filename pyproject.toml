[project]
name = "kian-trading-intelligence"
version = "0.20.0"
description = "Secure, auditable, cost-aware cryptocurrency trading and mining intelligence platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
    { name = "Amin Azimi", email = "noreply@azimi-innovation-lab.example" },
]

dependencies = [
    "fastapi>=0.115.0",
    "pydantic>=2.10.0",
    "uvicorn[standard]>=0.34.0",
    "cryptography>=42.0",
    "sqlalchemy>=2.0",
    "redis>=4.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8.0",
    "mypy>=1.13",
    "testcontainers[postgresql,redis]>=4.0",
    "psycopg2-binary>=2.9",
    "import-linter>=2.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["contracts", "services", "services.core", "services.core.routers", "services.identity", "services.market_data", "services.risk_kernel", "services.execution", "services.ledger", "services.agents", "services.mining", "services.client", "services.security", "services.release", "services.strategy_science", "services.evidence", "services.autonomy", "services.billing", "services.locked_ideas", "services.phase_b", "simulation", "formal"]

[tool.setuptools.package-dir]
contracts = "packages/contracts"
services = "services"
"services.core" = "services/core"
"services.core.routers" = "services/core/routers"
"services.identity" = "services/identity"
"services.market_data" = "services/market_data"
"services.risk_kernel" = "services/risk_kernel"
"services.execution" = "services/execution"
"services.ledger" = "services/ledger"
"services.agents" = "services/agents"
"services.mining" = "services/mining"
"services.client" = "services/client"
"services.security" = "services/security"
"services.release" = "services/release"
"services.strategy_science" = "services/strategy_science"
"services.evidence" = "services/evidence"
"services.autonomy" = "services/autonomy"
"services.billing" = "services/billing"
"services.locked_ideas" = "services/locked_ideas"
"services.phase_b" = "services/phase_b"
simulation = "simulation"
formal = "formal"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["services", "packages", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PL"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["PLR2004", "PLC0415", "B017"]

[tool.ruff.lint.isort]
known-first-party = ["contracts", "services"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.coverage.run]
source = ["services", "packages", "simulation"]
omit = ["tests/*", "*/__pycache__/*", ".venv/*"]

[tool.coverage.report]
show_missing = true
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
