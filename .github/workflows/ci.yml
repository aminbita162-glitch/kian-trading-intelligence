name: CI

on:
  push:
    branches: ["main", "phase/*"]
  pull_request:
    branches: ["main", "phase/*"]

permissions:
  contents: read

jobs:
  python-tests:
    name: Python Tests & Lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff format check
        run: ruff format --check services/ packages/ tests/

      - name: Ruff lint
        run: ruff check services/ packages/ tests/

      - name: Run tests
        run: pytest -v

      - name: Secret scan
        run: pytest tests/test_secret_scan.py -v

  frontend-checks:
    name: Frontend Type Check & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test -- --run
